<!doctype html>
<!--
    Source of site/ogp.png (1200×630), the link-preview image of the project site.
    Regenerate with headless Chrome:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
        --hide-scrollbars --window-size=1200,630 --virtual-time-budget=5000 \
        --screenshot=site/ogp.png scripts/site-ogp.html
-->
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <title>AXT Presen'it! OGP</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@500;700&family=M+PLUS+1:wght@500;700&display=swap"
        />
        <style>
            /*
             * Dark tokens of site/styles.css, with the hue swapped for the
             * AXT (AyaExpTech) theme color, oklch hue 281.44.
             */
            :root {
                --hue: 281.44;
                --backdrop: oklch(0.13 0.008 var(--hue));
                --surface: oklch(0.23 0.014 var(--hue) / 0.84);
                --text: oklch(0.93 0.008 var(--hue));
                --muted: oklch(0.71 0.012 var(--hue));
                --line: oklch(1 0 0 / 0.12);
                --accent: oklch(0.78 0.12 var(--hue));
                --slide-top: oklch(0.255 0.02 var(--hue));
                --slide-bottom: oklch(0.16 0.01 var(--hue));
                --slide-wash: oklch(0.5 0.14 var(--hue) / 0.42);
                --slide-border: oklch(0.34 0.014 var(--hue));
                --shadow: 0 1px 2px oklch(0 0 0 / 0.3), 0 12px 32px -6px oklch(0 0 0 / 0.55);
                --slide-shadow: 0 24px 64px -16px oklch(0 0 0 / 0.65);
            }
            html,
            body {
                margin: 0;
                width: 1200px;
                height: 630px;
                overflow: hidden;
            }
            body {
                position: relative;
                /* Ubuntu has no Japanese glyphs, so kana and kanji fall back to M PLUS 1. */
                font-family: "Ubuntu", "M PLUS 1", "Hiragino Sans", sans-serif;
                color: var(--text);
                background: var(--backdrop);
                -webkit-font-smoothing: antialiased;
            }
            /* The whole image is a slide sitting on the Viewer's stage. */
            .slide {
                position: absolute;
                inset: 28px 28px 52px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 0 84px 24px;
                border: 1px solid var(--slide-border);
                border-radius: 6px;
                background-color: var(--slide-bottom);
                background-image:
                    radial-gradient(
                        ellipse 90% 70% at 100% -10%,
                        var(--slide-wash),
                        transparent 58%
                    ),
                    linear-gradient(165deg, var(--slide-top) 0%, var(--slide-bottom) 100%);
                box-shadow: var(--slide-shadow);
            }
            .kicker {
                margin: 0 0 22px;
                font-size: 26px;
                font-weight: 500;
                letter-spacing: 0.06em;
                color: var(--accent);
            }
            h1 {
                margin: 0;
                font-size: 112px;
                font-weight: 700;
                line-height: 1.05;
                letter-spacing: 0.005em;
            }
            .tagline {
                margin: 30px 0 0;
                font-size: 52px;
                font-weight: 700;
                line-height: 1.2;
                color: var(--muted);
            }
            .footer {
                position: absolute;
                right: 30px;
                bottom: 24px;
                margin: 0;
                font-size: 18px;
                font-weight: 500;
                letter-spacing: 0.04em;
                color: var(--muted);
            }
            /* Copy of the Viewer's floating toolbar, as on the site's hero. */
            .toolbar {
                position: absolute;
                left: 50%;
                bottom: 26px;
                translate: -50% 0;
                display: flex;
                align-items: center;
                gap: 2px;
                padding: 5px;
                border: 1px solid var(--line);
                border-radius: 999px;
                color: var(--text);
                background: var(--surface);
                box-shadow: var(--shadow);
            }
            .toolbar svg {
                width: 42px;
                height: 42px;
                padding: 10px;
                fill: none;
                stroke: currentColor;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            .toolbar .fill {
                fill: currentColor;
                stroke: none;
            }
            .position {
                width: 84px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 5px;
                font-size: 16px;
                font-weight: 500;
                line-height: 1;
                font-variant-numeric: tabular-nums;
            }
            .dots {
                display: flex;
                gap: 4px;
            }
            .dots i {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--muted);
                opacity: 0.5;
            }
            .dots i.on {
                background: var(--accent);
                opacity: 1;
            }
            .separator {
                align-self: stretch;
                margin: 10px 5px;
                border-left: 1px solid var(--line);
            }
        </style>
    </head>
    <body>
        <div class="slide">
            <p class="kicker">Vite plugin for Markdown presentations</p>
            <h1>AXT Presen'it!</h1>
            <p class="tagline">Markdownから、発表まで。</p>
            <p class="footer">axt-studio.github.io/presen-it</p>
        </div>
        <div class="toolbar">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg>
            <span class="position"
                ><span>1 / 3</span><span class="dots"><i class="on"></i><i></i><i></i></span
            ></span>
            <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" /></svg>
            <span class="separator"></span>
            <svg viewBox="0 0 24 24">
                <rect x="4" y="4" width="6.5" height="6.5" rx="1.5" />
                <rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5" />
                <rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5" />
                <rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5" />
            </svg>
            <svg viewBox="0 0 24 24">
                <path d="M3.5 20.5l5-5" stroke-width="3.4" />
                <path d="M11 13l4-4" stroke-dasharray="1.6 2.4" />
                <circle cx="18" cy="6" r="2.6" class="fill" />
            </svg>
            <svg viewBox="0 0 24 24">
                <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" />
            </svg>
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="5.5" r="1.6" class="fill" />
                <circle cx="12" cy="12" r="1.6" class="fill" />
                <circle cx="12" cy="18.5" r="1.6" class="fill" />
            </svg>
        </div>
    </body>
</html>
