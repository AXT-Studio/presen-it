name: Verify JSR package
# This workflow never publishes. Registry publication needs explicit authorization.
on:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 11.11.0
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - run: pnpm check
            - run: pnpm check:jsr
